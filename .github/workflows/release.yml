name: Release

# Push a tag like `v1.2.0` to build installers and publish a GitHub Release.
# Run manually (Actions tab -> Release -> Run workflow) to build installers
# as downloadable workflow artifacts without publishing a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: Landmarker
  MAIN_JAR: landmarker.jar
  MAIN_CLASS: landmarker.App
  # Keep this constant so newer MSIs upgrade older installs in place.
  WIN_UPGRADE_UUID: B475EFD3-D0ED-4C6A-9EAF-3CAB63B89DC6

jobs:
  package:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
            type: dmg
          - os: macos-15-intel
            label: macos-x64
            type: dmg
          - os: windows-latest
            label: windows-x64
            type: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # jpackage in JDK 25 works with WiX 4+ on Windows; the app itself still
      # compiles for Java 17 (maven.compiler.release in pom.xml).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          fi
          # jpackage needs 1-3 numeric components (e.g. 1.2.0); drop suffixes like -beta.
          VERSION="$(echo "$VERSION" | sed -E 's/^([0-9]+(\.[0-9]+){0,2}).*/\1/')"
          if ! [[ "$VERSION" =~ ^[1-9][0-9]*(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version '$VERSION' is not valid for jpackage (e.g. use tag v1.2.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging version $VERSION"

      - name: Build and test
        run: mvn -B package

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix --version

      - name: Package with jpackage
        run: |
          mkdir -p build/input build/dist
          cp "target/$MAIN_JAR" build/input/

          # Bundle only the JDK modules the app actually uses.
          MODULES="$(jdeps --print-module-deps --ignore-missing-deps "build/input/$MAIN_JAR")"
          echo "Runtime modules: $MODULES"

          ARGS=(
            --type "${{ matrix.type }}"
            --name "$APP_NAME"
            --app-version "${{ steps.version.outputs.version }}"
            --vendor "$APP_NAME"
            --input build/input
            --main-jar "$MAIN_JAR"
            --main-class "$MAIN_CLASS"
            --add-modules "$MODULES"
            --jlink-options "--strip-debug --no-header-files --no-man-pages --strip-native-commands"
            --dest build/dist
          )

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ARGS+=(--mac-package-identifier "io.github.tomayyeung.landmarker")
          else
            ARGS+=(
              --win-menu
              --win-shortcut
              --win-dir-chooser
              --win-per-user-install
              --win-upgrade-uuid "$WIN_UPGRADE_UUID"
            )
          fi

          jpackage "${ARGS[@]}"

          # Give each installer a platform-specific name.
          for f in build/dist/*."${{ matrix.type }}"; do
            mv "$f" "build/dist/${APP_NAME}-${{ steps.version.outputs.version }}-${{ matrix.label }}.${{ matrix.type }}"
          done
          ls -la build/dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: build/dist/*
          if-no-files-found: error

      # Upload the cross-platform jar once.
      - uses: actions/upload-artifact@v4
        if: matrix.label == 'windows-x64'
        with:
          name: jar
          path: target/${{ env.MAIN_JAR }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          mv dist/landmarker.jar "dist/${APP_NAME}-${TAG#v}.jar"

          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi

          cat > notes.md <<'EOF'
          ## Downloads

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | `*-macos-arm64.dmg` |
          | macOS (Intel) | `*-macos-x64.dmg` |
          | Windows | `*-windows-x64.msi` |
          | Any OS with Java 17+ | `*.jar` (run with `java -jar`) |

          The installers include a Java runtime, so you don't need Java installed.

          **macOS:** the app isn't signed. If macOS blocks it, open **System Settings → Privacy & Security** and click **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/Landmarker.app`.

          **Windows:** if SmartScreen warns about an unrecognized app, click **More info → Run anyway**.
          EOF

          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$APP_NAME $TAG" \
            --notes-file notes.md \
            --generate-notes \
            $PRERELEASE
